<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BREAKING BADX25 | Team Meet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: #111;
            background: #f4f4f2;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
        }

        /* =========================
           SUBTLE 3D BACKGROUND
        ========================== */

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .orb-one {
            width: 300px;
            height: 300px;
            top: -140px;
            right: -100px;

            background: linear-gradient(
                145deg,
                #ffffff,
                #d5d5d5
            );

            box-shadow:
                inset -35px -35px 70px rgba(0, 0, 0, 0.08),
                20px 30px 80px rgba(0, 0, 0, 0.08);
        }

        .orb-two {
            width: 190px;
            height: 190px;
            bottom: -90px;
            left: -60px;

            background: linear-gradient(
                145deg,
                #eeeeee,
                #cccccc
            );

            box-shadow:
                inset 20px 20px 50px rgba(255, 255, 255, 0.8),
                15px 20px 60px rgba(0, 0, 0, 0.07);
        }

        /* =========================
           MAIN CARD
        ========================== */

        .card {
            width: min(90%, 720px);

            padding: 65px 60px;

            background: rgba(255, 255, 255, 0.82);

            border: 1px solid rgba(0, 0, 0, 0.08);

            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.08),
                0 5px 15px rgba(0, 0, 0, 0.04);

            text-align: center;

            position: relative;
            z-index: 2;
        }

        /* =========================
           LABEL
        ========================== */

        .label {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;

            border-radius: 50px;

            background: #f1f1f1;

            border: 1px solid #dedede;

            color: #777;

            font-size: 10px;
            font-weight: 600;

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #222;
        }

        /* =========================
           TITLE
        ========================== */

        h1 {
            margin-top: 28px;

            font-size: clamp(48px, 9vw, 82px);

            line-height: 0.9;

            letter-spacing: -5px;

            font-weight: 800;

            color: #111;
        }

        h1 span {
            color: #777;
            font-weight: 400;
        }

        /* =========================
           SUBTITLE
        ========================== */

        .subtitle {
            margin-top: 30px;

            font-size: 16px;

            line-height: 1.7;

            color: #777;
        }

        /* =========================
           QUOTE
        ========================== */

        .quote {
            margin: 35px auto;

            max-width: 470px;

            color: #555;

            font-size: 15px;

            line-height: 1.7;
        }

        .quote strong {
            color: #111;
            font-weight: 600;
        }

        /* =========================
           GOOGLE MEET BUTTON
        ========================== */

        .join-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;
            gap: 12px;

            min-width: 210px;

            padding: 16px 25px;

            border-radius: 14px;

            background: #111;

            color: #fff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 0.5px;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .join-btn:hover {
            transform: translateY(-3px);

            background: #222;

            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.18);
        }

        .arrow {
            font-size: 17px;

            transition:
                transform 0.25s ease;
        }

        .join-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* =========================
           FOOTER
        ========================== */

        .footer {
            width: 100%;

            margin-top: 55px;

            padding: 35px 20px 30px;

            text-align: center;

            border-top: 1px solid rgba(0, 0, 0, 0.08);

            position: relative;
            z-index: 2;
        }

        .footer-title {
            color: #777;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 25px;
        }

        .social-links {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 28px;
        }

        .social {
            width: 62px;
            height: 62px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eeeeee;

            border: 1px solid #d9d9d9;

            color: #777;

            text-decoration: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social svg {
            width: 23px;
            height: 23px;

            fill: currentColor;
        }

        .social:hover {
            transform: translateY(-5px);

            background: #111;

            color: #fff;

            border-color: #111;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .footer-bottom {
            margin-top: 22px;

            font-size: 10px;

            color: #aaa;

            letter-spacing: 1.5px;
        }

        /* =========================
           DECORATIVE LINES
        ========================== */

        .line-horizontal {
            position: fixed;

            width: 100px;
            height: 1px;

            left: 30px;
            top: 50%;

            background: rgba(0, 0, 0, 0.08);
        }

        .line-vertical {
            position: fixed;

            width: 1px;
            height: 100px;

            right: 30px;
            top: 30px;

            background: rgba(0, 0, 0, 0.08);
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            body {
                padding-top: 30px;
            }

            .card {
                padding: 50px 25px;

                border-radius: 22px;
            }

            h1 {
                letter-spacing: -3px;
            }

            .subtitle {
                font-size: 14px;
            }

            .quote {
                font-size: 14px;
            }

            .join-btn {
                width: 100%;
            }

            .social-links {
                gap: 18px;
            }

            .social {
                width: 56px;
                height: 56px;
            }

            .line-horizontal,
            .line-vertical {
                display: none;
            }
        }
    </style>
</head>

<body>
